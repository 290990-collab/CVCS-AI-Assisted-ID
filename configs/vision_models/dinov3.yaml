# kwargs passati a DINOv3Encoder(**kwargs)
#
# NOTA: i checkpoint DINOv3 ufficiali di Meta su HuggingFace sono "gated":
# la prima volta serve accettare la licenza sulla pagina del modello ed
# essere autenticati (`huggingface-cli login`).
hf_name: facebook/dinov3-vitb16-pretrain-lvd1689m
image_size: 224          # risoluzione di pretrain dei checkpoint dinov3 vitb16 (sweep: multipli di 16)
pooling: natural         # natural(CLS) | mean | gem
gem_p: 3.0               # esponente del GeM (solo se pooling=gem)
extraction_layer: -1     # layer da cui leggere i token: -1 ultimo, -2 penultimo, ...
